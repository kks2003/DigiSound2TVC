formálás (Noise Shaping)",desc:"A konverzió során keletkező hibát (zajt) áttolja a magasabb, kevésbé hallható frekvenciákra. Ditherrel együtt használva sokat javít a minőségen."},{title:"TVC Bináris (Tömörített)",desc:"1 bájtba 2 darab 4-bites mintát csomagol (felső és alsó 4 bit). Helytakarékos formátum. A mentésnél beállítható a sorrend (Felső-Alsó vagy Alsó-Felső)."},{title:"TVC Bináris (Kibontott)",desc:"1 bájtba 1 mintát tesz. A minta a 2-5. bitekre kerül. A 0-1. bitek a kiválasztott grafikus módnak megfelelően (00, 01, 11) lesznek beállítva, így közvetlenül lehet a 6-os portra írni a bájtokat a megadott grafikus módban."},{title:"Nézet (Zoom & Pan)",desc:"A nagyítással (Zoom) beleláthatsz a hanghullám részleteibe, a pásztázással (Pan) pedig mozoghatsz a felnagyított nézetben. Az egérgörgővel is nagyíthatsz a hullámforma felett. A 'Mindet mutat' gombbal visszaállíthatod az alapértelmezett nézetet."},{title:"Kijelölés",desc:"Csak a kijelölt rész kerül konvertálásra és mentésre. A 'Zoom a kijelölésre' gombbal ráközelíthetsz a választott részre. A 'Mindet kijelöl' és 'Kijelölés törlése' gombokkal gyorsan módosíthatod a tartományt. A kijelölés 0,01 másodperces lépésekkel finomhangolható."},{title:"Mintavételezés",desc:"Meghatározza a kimeneti fájl frekvenciáját. Magasabb érték jobb minőséget, de nagyobb fájlméretet jelent. A becsült fájlméretet a hullámforma alatt láthatod. Egyedi frekvencia is megadható."},{title:"Beállítások mentése/töltése",desc:"A beállítások elmenthetők és visszatölthetők a böngésző helyi tárhelyébe (offline is működik)."},{title:"TRSE kompatibilis mentés",desc:"Ha ez be van nyomva (ez az alap) akkor packed módnál ha a konvertálandó bájt értéke 0 akkor az helyett 7-et ír be a bináris fájlba és a fájl végére pedig mindig rak egy 0-ás (minta vége) bájtot. Unpacked módnál nem módosítja a 0 értékeket és nem rak a végére 0-t, hanem az utolsó bájt 6. bitjét (64) 1-re állítja."},{title:"Minta ritkítás",desc:"A minta ritkítás (decimation) során a prog
